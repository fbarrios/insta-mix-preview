[project]
name = "insta-mix-preview"
version = "1.0.0"
description = "Generate square Instagram previews by overlaying audio snippets over a mix cover."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "librosa>=0.11.0",
    "numpy>=1.26",
    "opencv-python>=4.11.0.86",
    "pillow>=11.0",
    "pygame>=2.6.1",
]

[project.scripts]
insta-mix-preview = "insta_mix_preview.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/insta_mix_preview"]
